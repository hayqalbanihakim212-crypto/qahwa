<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#ffffff">
<title>Qahwa Coffee Shop And Entertain: Pesan</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<link href="/ds.css" rel="stylesheet">
</head>
<body>
<section class="intro" id="intro" aria-label="Selamat datang">
  <div class="stage"><div class="fb" aria-hidden="true"><span lang="ar" dir="rtl">قهوة</span></div><canvas id="cv" aria-label="Cangkir kopi 3D, geser untuk memutar"></canvas></div>
  <div class="hero">
    <h1>Qahwa</h1>
    <p class="muted">Coffee Shop And Entertain</p>
    <div class="greet" id="greet" hidden role="status"></div>
    <button class="btn" id="go" data-a="go">Mulai pesan</button>
    <p class="muted">Pesan dan bayar QRIS langsung dari meja</p>
  </div>
</section>
<header class="top">
  <div class="ar" lang="ar" dir="rtl">قهوة</div>
  <div class="ttl">Qahwa Coffee Shop And Entertain<span>Pesan dan bayar QRIS dari meja</span></div>
  <div class="pill" id="mj" hidden></div>
</header>
<div class="banner" id="mode" hidden></div>
<main class="wrap" id="app"></main>
<div class="bar" id="cart" hidden></div>
<div class="toast" id="msg" hidden></div>
<script src="/app.js"></script>
</body>
</html>
